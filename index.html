<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>
二十岁是我们的歌 · 小镇档案馆
</title>


<style>

body{

margin:0;

background:#f5f0e6;

font-family:
"PingFang SC",
"Microsoft YaHei",
sans-serif;

color:#403a32;

}


.container{

max-width:700px;

margin:auto;

padding:50px 30px;

}


h1{

font-weight:400;

letter-spacing:4px;

text-align:center;

}


.subtitle{

text-align:center;

margin-top:20px;

line-height:2;

}



.card{

background:white;

padding:30px;

margin-top:40px;

border-radius:15px;

box-shadow:
0 5px 20px rgba(0,0,0,0.08);

}


input{

width:80%;

padding:12px;

font-size:16px;

border:1px solid #ddd;

border-radius:8px;

}


button{

margin-top:20px;

padding:12px 35px;

border:none;

border-radius:25px;

background:#85745d;

color:white;

cursor:pointer;

}


.chapter{

margin-top:25px;

padding:20px;

background:#faf8f2;

border-radius:12px;

}


.video{

margin-top:15px;

}


video{

width:100%;

border-radius:10px;

}


.hidden{

display:none;

}


.small{

font-size:14px;

opacity:0.7;

}


</style>


</head>


<body>


<div class="container">


<div id="login">


<h1>
二十岁是我们的歌
</h1>


<p class="subtitle">

小镇档案馆<br>

请输入你的居民坐标

</p>



<div class="card">


<input id="code"

placeholder="居民编号">


<br>


<button onclick="enterTown()">

进入小镇

</button>


</div>


</div>





<div id="archive"

class="hidden">


<h1>

居民档案

</h1>



<div class="card">


<h2 id="name">

</h2>


<p>

身份确认完成。

</p>


<p class="small">

正在调取你在小镇留下的记录……

</p>



</div>




<div id="files">


</div>



</div>


</div>





<script>


const residents={


"410001":{

name:"琳达",

chapters:[


{

title:"第一章·辩",

videos:[

["c1_001_debate.mp4","第一次争论"]

]

},



{

title:"第二章·行",

videos:[

["c2_001_yancheng.mp4","盐城列车记录"],

["c2_002_harbin.mp4","冬日远行"]

]

},


{

title:"第三章·默",

videos:[

["c3_001_meeting.mp4","偶然相遇"]

]

},


{

title:"第四章·逢",

videos:[

["c4_001_graduation.mp4","春日重逢"]

]

}


]


},




"410002":{

name:"程程",

chapters:[]

},



"410003":{

name:"小林",

chapters:[]

}


};





function enterTown(){


let code=document
.getElementById("code")
.value;



if(!residents[code]){


alert("这个坐标尚未被记录。");

return;


}



let person=residents[code];



document
.getElementById("login")
.classList
.add("hidden");



document
.getElementById("archive")
.classList
.remove("hidden");



document
.getElementById("name")
.innerHTML=

"居民："+person.name;



let html="";



person.chapters.forEach(ch=>{


html+=`

<div class="chapter">

<h3>${ch.title}</h3>

`;


ch.videos.forEach(v=>{


html+=`

<div class="video">

<p>${v[1]}</p>


<video controls>

<source src="videos/${getPath(ch.title)}/${v[0]}">

</video>


</div>


`;



});



html+=`</div>`;


});



document
.getElementById("files")
.innerHTML=html;



}





function getPath(title){


if(title.includes("第一"))
return "chapter1";


if(title.includes("第二"))
return "chapter2";


if(title.includes("第三"))
return "chapter3";


if(title.includes("第四"))
return "chapter4";


}


</script>



</body>

</html>
